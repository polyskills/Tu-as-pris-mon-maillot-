packages:
  - shared/*
  - apps/*

# Scripts d'installation autorisés (pnpm les refuse par défaut ; exigé par le kit Polytools Admin v2).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.15'
  - '@better-auth/drizzle-adapter@1.7.15'
  - '@better-auth/kysely-adapter@1.7.15'
  - '@better-auth/memory-adapter@1.7.15'
  - '@better-auth/mongo-adapter@1.7.15'
  - '@better-auth/prisma-adapter@1.7.15'
  - '@better-auth/telemetry@1.7.15'
  - better-auth@1.7.15
