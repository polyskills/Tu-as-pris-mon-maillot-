# /etc/nginx/sites-available/voyage.adaptools.fr
# Interface Next.js sur 127.0.0.1:3100, API sur 127.0.0.1:4000, même domaine.
# Certificat : sudo certbot --nginx -d voyage.adaptools.fr

limit_req_zone $binary_remote_addr zone=maillot_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name voyage.adaptools.fr;

    client_max_body_size 2m;

    location /api/ {
        limit_req zone=maillot_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
